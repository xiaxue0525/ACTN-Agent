services:
  actagent-gateway:
    image: ${ACTAGENT_IMAGE:-actagent:local}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      ACTAGENT_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` (used by Compose for the bind-mount source below) cannot leak
      # into runtime code that resolves these env vars inside the container.
      # Without this override, a macOS host path like /Users/<you>/.actagent/...
      # imported from .env caused first-reply `mkdir '/Users'` EACCES failures
      # in Linux Docker (#77436).
      ACTAGENT_STATE_DIR: /home/node/.actagent
      ACTAGENT_CONFIG_PATH: /home/node/.actagent/actagent.json
      ACTAGENT_CONFIG_DIR: /home/node/.actagent
      ACTAGENT_WORKSPACE_DIR: /home/node/.actagent/workspace
      ACTAGENT_GATEWAY_TOKEN: ${ACTAGENT_GATEWAY_TOKEN:-}
      ACTAGENT_ALLOW_INSECURE_PRIVATE_WS: ${ACTAGENT_ALLOW_INSECURE_PRIVATE_WS:-}
      # Empty means auto: Bonjour disables itself in detected containers.
      # Set 0 only on host/macvlan/mDNS-capable networks; set 1 to force off.
      ACTAGENT_DISABLE_BONJOUR: ${ACTAGENT_DISABLE_BONJOUR:-}
      # OpenTelemetry export is outbound OTLP/HTTP from the Gateway. Prometheus
      # uses the existing authenticated Gateway route; it does not need a port.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      ACTAGENT_OTEL_PRELOADED: ${ACTAGENT_OTEL_PRELOADED:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${ACTAGENT_TZ:-UTC}
    volumes:
      - ${ACTAGENT_CONFIG_DIR:-${HOME:-/tmp}/.actagent}:/home/node/.actagent
      - ${ACTAGENT_WORKSPACE_DIR:-${HOME:-/tmp}/.actagent/workspace}:/home/node/.actagent/workspace
      - ${ACTAGENT_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.actagent-auth-profile-secrets}:/home/node/.config/actagent
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg ACTAGENT_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with ACTAGENT_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    # Let bundled local-model providers reach host-side LM Studio/Ollama via
    # http://host.docker.internal:<port>. Docker Desktop usually provides this
    # alias; the host-gateway mapping makes it work on Linux Docker Engine too.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ACTAGENT_GATEWAY_PORT:-19199}:19199"
      - "${ACTAGENT_BRIDGE_PORT:-18790}:18790"
      - "${ACTAGENT_MSTEAMS_PORT:-3978}:3978"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${ACTAGENT_GATEWAY_BIND:-lan}",
        "--port",
        "19199",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19199/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  actagent-cli:
    image: ${ACTAGENT_IMAGE:-actagent:local}
    network_mode: "service:actagent-gateway"
    env_file:
      - path: .env
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      ACTAGENT_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` cannot leak into runtime code via the env_file import (#77436).
      ACTAGENT_STATE_DIR: /home/node/.actagent
      ACTAGENT_CONFIG_PATH: /home/node/.actagent/actagent.json
      ACTAGENT_CONFIG_DIR: /home/node/.actagent
      ACTAGENT_WORKSPACE_DIR: /home/node/.actagent/workspace
      ACTAGENT_GATEWAY_TOKEN: ${ACTAGENT_GATEWAY_TOKEN:-}
      ACTAGENT_ALLOW_INSECURE_PRIVATE_WS: ${ACTAGENT_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${ACTAGENT_TZ:-UTC}
    volumes:
      - ${ACTAGENT_CONFIG_DIR:-${HOME:-/tmp}/.actagent}:/home/node/.actagent
      - ${ACTAGENT_WORKSPACE_DIR:-${HOME:-/tmp}/.actagent/workspace}:/home/node/.actagent/workspace
      - ${ACTAGENT_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.actagent-auth-profile-secrets}:/home/node/.config/actagent
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - actagent-gateway
