services:
  - type: web
    name: actagent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ACTAGENT_GATEWAY_PORT
        value: "8080"
      - key: ACTAGENT_STATE_DIR
        value: /data/.actagent
      - key: ACTAGENT_WORKSPACE_DIR
        value: /data/workspace
      - key: ACTAGENT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: actagent-data
      mountPath: /data
      sizeGB: 1
